name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Least privilege: read the repo, publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Queue rather than cancel so a push mid-deploy
# still ships instead of being dropped.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm install` — the site has zero dependencies on purpose.
      - name: Build
        run: node build.js

      - name: Fail if the build produced nothing
        run: test -f dist/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
