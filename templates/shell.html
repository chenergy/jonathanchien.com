<!doctype html>
<html lang="{{lang}}" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{pageTitle}}</title>
<meta name="description" content="{{description}}">
{{robots}}<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="{{ogType}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta name="twitter:card" content="summary">
<link rel="alternate" type="application/rss+xml" title="{{siteTitle}}" href="{{base}}feed.xml">
<link rel="icon" href="{{base}}assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{base}}assets/css/style.css">
<script>
  // Applied before first paint so there is no theme flash.
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="wordmark" href="{{base}}index.html">{{siteTitle}}</a>
    <nav class="site-nav" aria-label="Primary">
      <ul>
{{nav}}
      </ul>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.6v2.6M12 18.8v2.6M2.6 12h2.6M18.8 12h2.6M5.3 5.3l1.9 1.9M16.8 16.8l1.9 1.9M18.7 5.3l-1.9 1.9M7.2 16.8l-1.9 1.9"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M20 14.2A8.4 8.4 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/>
      </svg>
    </button>
  </div>
</header>

<main id="main" class="wrap">
{{content}}
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="copyright">&copy; {{year}} {{author}}</p>
    <ul class="social">
{{social}}
    </ul>
  </div>
</footer>

<script src="{{base}}assets/js/main.js" defer></script>
</body>
</html>
